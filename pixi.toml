[workspace]
authors = ["JH Wang <1125623896@qq.com>"]
channels = ["conda-forge"]
name = "bacteria_analysis"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab"

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = "3.11.*"
pandas = ">=2.2,<3"
pyarrow = ">=15,<22"
numpy = ">=1.26,<3"
matplotlib = ">=3.8,<4"
seaborn = ">=0.13,<0.14"
openpyxl = ">=3.1,<4"
ipykernel = ">=7.2.0,<8"
scikit-learn = ">=1.8.0,<2"
plotly = ">=6.6.0,<7"
nbformat = ">=5.10.4,<6"
scipy = ">=1.17.1,<2"
biopython = ">=1.84,<2"
jupyterlab = ">=4.6.3,<5"
